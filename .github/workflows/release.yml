# Builds Teleport from source and publishes everything on GitHub:
#
#   RPM / DEB / tarball  ->  GitHub Release
#   container image      ->  ghcr.io/<owner>/teleport:<version>
#   Helm charts          ->  oci://ghcr.io/<owner>/charts/<chart>  (+ .tgz on the release)
#
# Triggers
#   * push of a tag vX.Y.Z      : builds the source ref with the same name and publishes.
#   * "Run workflow" (manual)    : builds any ref; publishes only when "publish" is ticked.
#
# Where the source comes from (first match wins):
#   1. the "source_repository" input of a manual run
#   2. the repository variable TELEPORT_SOURCE_REPOSITORY (e.g. jwklijnsma/teleport)
#   3. gravitational/teleport
#
# Optional secrets: RPM_GPG_PRIVATE_KEY, RPM_GPG_PASSPHRASE (sign the RPM).

name: Release

run-name: Teleport ${{ inputs.ref || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Teleport source ref to build (tag, branch or SHA)
        required: true
        default: v15.5.4
      source_repository:
        description: Source repo (owner/name). Empty = repo variable or gravitational/teleport
        required: false
        default: ""
      publish:
        description: Push image + charts to GHCR and create a GitHub Release
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: ${{ inputs.source_repository || vars.TELEPORT_SOURCE_REPOSITORY || 'gravitational/teleport' }}
  SOURCE_REF: ${{ inputs.ref || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
  # EL8 gives binaries that run on RHEL 8, 9 and 10 (glibc >= 2.28).
  BUILD_IMAGE: rockylinux:8
  HELM_CHARTS: teleport-cluster teleport-kube-agent

jobs:
  # ----------------------------------------------------------------------------
  # Binaries -> tarball -> RPM/DEB -> container image
  # ----------------------------------------------------------------------------
  build:
    name: Binaries, RPM and image
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Check out build scripts
        uses: actions/checkout@v5

      - name: Check out Teleport source (${{ env.SOURCE_REPOSITORY }} @ ${{ env.SOURCE_REF }})
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: src
          submodules: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Version and names
        id: meta
        run: |
          version="$(sed -n 's/^VERSION=//p' src/Makefile)"
          [ -n "$version" ] || { echo "::error::no VERSION in src/Makefile"; exit 1; }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=${version}"
            echo "image=ghcr.io/${owner}/teleport"
          } >> "$GITHUB_OUTPUT"
          echo "Building Teleport ${version} from ${SOURCE_REPOSITORY}@${SOURCE_REF}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restore dependency caches
        uses: actions/cache@v4
        with:
          path: src/.cache
          key: deps-${{ hashFiles('src/build.assets/versions.mk', 'src/Cargo.lock', 'src/go.sum') }}
          restore-keys: deps-

      - name: Build binaries and release tarball
        run: |
          docker run --rm -v "$PWD:/work" -w /work/src "$BUILD_IMAGE" bash -c '
            set -euo pipefail
            source /work/ci/setup-toolchain.sh
            make release-unix-preserving-webassets
            ./build/teleport version
            # keep the cache small: downloads only, no build output
            rm -rf .cache/cargo/registry/src
          '

      - name: Build RPM and DEB
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PKG_VENDOR: ${{ github.repository_owner }}
          PKG_MAINTAINER: ${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>
          CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e VERSION -e PKG_VENDOR -e PKG_MAINTAINER -e CI_PROJECT_URL \
            -e RPM_GPG_PRIVATE_KEY -e RPM_GPG_PASSPHRASE \
            -e TELEPORT_SRC=/work/src \
            "$BUILD_IMAGE" bash -c '
              set -euo pipefail
              dnf -y -q module enable ruby:3.1
              dnf -y -q install ruby ruby-devel gcc make rpm-build rpm-sign binutils gnupg2 tar gzip
              gem install --no-document fpm -v 1.15.1
              ci/package.sh "$VERSION" "src/build/artifacts/teleport-v${VERSION}-linux-amd64-bin.tar.gz" dist
              rpm -qip dist/*.rpm
              rpm -qlp dist/*.rpm
            '
          sudo chown -R "$(id -u):$(id -g)" dist src/.cache
          cp "src/build/artifacts/teleport-v${VERSION}-linux-amd64-bin.tar.gz" dist/
          (cd dist && sha256sum -- *.tar.gz > "teleport-v${VERSION}-linux-amd64-bin.tar.gz.sha256")
          ls -lh dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Build container image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          ctx="$(mktemp -d)"
          cp "dist/teleport_${VERSION}_amd64.deb" src/build.assets/charts/fetch-debs "$ctx/"
          # Same Dockerfile upstream uses for teleport-distroless.
          docker build \
            --file src/build.assets/charts/Dockerfile-distroless \
            --build-arg "TELEPORT_VERSION=${VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$(git -C src rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${IMAGE}:${VERSION}" \
            "$ctx"
          docker run --rm --entrypoint /usr/local/bin/teleport "${IMAGE}:${VERSION}" version

      - name: Push container image
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE}:${VERSION}"
          echo "Pushed \`${IMAGE}:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------------------
  # Helm charts
  # ----------------------------------------------------------------------------
  helm:
    name: Helm charts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Teleport source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          submodules: false

      - name: Package charts
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p dist
          for chart in $HELM_CHARTS; do
            dir="examples/chart/${chart}"
            # Default the charts to the image built by this workflow.
            sed -i "s#^image: public.ecr.aws/gravitational/teleport-distroless\$#image: ghcr.io/${owner}/teleport#" "${dir}/values.yaml"
            helm package "${dir}" --destination dist
          done
          ls -l dist

      - name: Upload charts
        uses: actions/upload-artifact@v4
        with:
          name: charts
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Push charts to GHCR
        if: env.PUBLISH == 'true'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tgz in dist/*.tgz; do
            helm push "$tgz" "oci://ghcr.io/${owner}/charts"
          done

  # ----------------------------------------------------------------------------
  # GitHub Release
  # ----------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [build, helm]
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > notes.md <<EOF
          Teleport ${VERSION}, built from \`${SOURCE_REPOSITORY}@${SOURCE_REF}\`.

          **RPM (RHEL 8/9/10 and compatibles, x86_64)**
          \`\`\`
          sudo dnf install ${base}/teleport-${VERSION}-1.x86_64.rpm
          \`\`\`

          **Container image**
          \`\`\`
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          **Helm**
          \`\`\`
          helm install teleport oci://ghcr.io/${owner}/charts/teleport-cluster --version ${VERSION}
          \`\`\`
          EOF
          ls -lh dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Teleport ${VERSION}" --notes-file notes.md
          fi
